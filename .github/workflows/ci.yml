name: Sentinel AI CI

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege by default: jobs get read-only access to the repo unless a job
# explicitly asks for more (CodeQL needs security-events: write to upload results).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Backend tests
        run: ./mvnw -f backend/pom.xml test

      - name: Frontend syntax
        run: node --check backend/src/main/resources/static/app.js

      - name: Demo script syntax
        run: sh -n scripts/demo.sh

      - name: Docker build
        run: docker build -t sentinel-ai:test .

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build backend jar
        run: ./mvnw -f backend/pom.xml -DskipTests package

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: frontend

  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform format
        run: terraform -chdir=infra/aws fmt -check -recursive

      - name: Terraform init without backend
        run: terraform -chdir=infra/aws init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/aws validate

  # Automated security scanning. The in-app Secret Shield scans pasted content;
  # this scans the repository itself on every push and PR, so a committed
  # credential or a vulnerable dependency is caught before it ships.
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the secret scanner can see every commit, not just the tip.
          fetch-depth: 0

      - name: Scan git history for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan dependencies and IaC for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          # Only fail on issues that have a fix available; unfixable transitive
          # advisories are reported but do not block the pipeline.
          ignore-unfixed: true
          exit-code: "1"

      - name: Audit frontend npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  # Static analysis (SAST). CodeQL reads the Java and TypeScript for injection,
  # auth, and data-flow bugs and reports them in the repo's Security tab.
  codeql:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
